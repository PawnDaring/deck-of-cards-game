<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Browser Test</title>
    
    <!-- Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .test-title {
            color: white;
            margin: 0 0 10px 0;
        }
        
        .test-description {
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }
        
        .screen {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1 class="test-title">🔍 Deck Browser Test</h1>
            <p class="test-description">Testing the deck browser functionality with a complete deck of cards</p>
        </div>
        
        <!-- Deck Browser Screen -->
        <section id="deck-browser" class="screen">
            <div class="browser-container">
                <h2 class="browser-title">🔍 Browse the Deck</h2>
                
                <div class="browser-controls">
                    <div class="filter-controls">
                        <label for="suit-filter">Filter by Suit:</label>
                        <select id="suit-filter">
                            <option value="all">All Suits</option>
                            <option value="spades">♠ Spades</option>
                            <option value="hearts">♥ Hearts</option>
                            <option value="diamonds">♦ Diamonds</option>
                            <option value="clubs">♣ Clubs</option>
                        </select>

                        <label for="rank-filter">Filter by Rank:</label>
                        <select id="rank-filter">
                            <option value="all">All Ranks</option>
                            <option value="A">Ace</option>
                            <option value="2,3,4,5,6,7,8,9,10">Numbers (2-10)</option>
                            <option value="J,Q,K">Face Cards</option>
                        </select>

                        <label for="color-filter">Filter by Color:</label>
                        <select id="color-filter">
                            <option value="all">All Colors</option>
                            <option value="red">Red</option>
                            <option value="black">Black</option>
                        </select>

                        <label for="sort-by">Sort by:</label>
                        <select id="sort-by">
                            <option value="suit-rank">Suit, then Rank</option>
                            <option value="rank-suit">Rank, then Suit</option>
                            <option value="color-suit">Color, then Suit</option>
                            <option value="shuffle">Random</option>
                        </select>
                    </div>

                    <div class="view-controls">
                        <button id="grid-view-btn" class="view-btn active">Grid View</button>
                        <button id="list-view-btn" class="view-btn">List View</button>
                        <button id="flip-all-btn" class="action-btn">Flip All Face Up</button>
                        <button id="reset-filters-btn" class="action-btn">Reset Filters</button>
                    </div>

                    <div class="browser-info">
                        <span>Showing <span id="cards-shown">52</span> of 52 cards</span>
                    </div>
                </div>

                <div class="browser-content">
                    <div id="deck-display" class="deck-grid">
                        <!-- Cards will be dynamically inserted here -->
                    </div>

                    <div id="card-details" class="card-details-panel">
                        <div class="card-details-placeholder">
                            <div class="placeholder-icon">🎴</div>
                            <h3>Select a card to view details</h3>
                            <p>Click on any card to explore its properties and characteristics.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module">
        import DeckBrowser from './src/games/DeckBrowser.js';
        import { SoundManager } from './src/utils/SoundManager.js';

        async function testDeckBrowser() {
            console.log('🧪 Testing Deck Browser...');
            
            try {
                // Initialize sound manager
                const soundManager = new SoundManager();
                
                // Create deck browser instance
                const browser = new DeckBrowser({
                    container: document.getElementById('deck-browser'),
                    soundManager: soundManager,
                    settings: { volume: 0.5, animations: true }
                });
                
                // Initialize the browser
                await browser.init();
                
                console.log('✅ Deck Browser test initialized successfully!');
                console.log('🎯 Try filtering and sorting the cards using the controls above.');
                
            } catch (error) {
                console.error('❌ Deck Browser test failed:', error);
                
                // Show error on page
                const container = document.querySelector('.test-container');
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = `
                    background: rgba(231, 76, 60, 0.2);
                    border: 2px solid #e74c3c;
                    border-radius: 10px;
                    padding: 20px;
                    margin-top: 20px;
                    color: white;
                `;
                errorDiv.innerHTML = `
                    <h3>❌ Test Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check the browser console for more details.</p>
                `;
                container.appendChild(errorDiv);
            }
        }

        // Start the test when page loads
        document.addEventListener('DOMContentLoaded', testDeckBrowser);
    </script>
</body>
</html>
